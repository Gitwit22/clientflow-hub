services:
  - type: web
    name: clientflow-hub
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run preview
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        scope: build
      - key: VITE_API_URL
        scope: runtime
    rootDir: .
    healthCheckPath: /
    preDeployCommand: ""
